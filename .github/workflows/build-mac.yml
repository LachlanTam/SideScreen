name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          cd MacHost
          swift test

      - name: Build app and DMG (Universal Binary, ad-hoc signed)
        run: ./scripts/build_mac.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SideScreen-mac
          path: SideScreen-*-mac-universal.dmg
          if-no-files-found: error

      - name: Lint
        run: |
          brew install swiftlint
          cd MacHost
          swiftlint lint --config .swiftlint.yml --strict
